# Temporary, tightly scoped lockfile repair. Remove after the one-time bot commit.
name: CyberTrace one-time security lockfile repair
on:
  push:
    branches: [security/isolated-trust-boundary-audit-20261123]
    paths:
      - package.json
      - .github/workflows/security-lockfile-sync-temporary.yml
permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.repository == 'saber20005/CyberTrace' && github.ref == 'refs/heads/security/isolated-trust-boundary-audit-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/isolated-trust-boundary-audit-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Resolve package-lock from patched manifest, without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm patched transitive versions
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('package-lock.json','utf8')).packages;
          const grpc=p['node_modules/@grpc/grpc-js']?.version;
          const re2=p['node_modules/re2js']?.version;
          const vite=p['node_modules/vite']?.version;
          console.log(JSON.stringify({grpc,re2,vite}));
          if(grpc!=='1.13.7'||re2!=='2.8.7')process.exit(1);
          JS
      - name: Commit only updated lockfile to the security branch
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(security): regenerate lockfile with patched transitive dependencies'
          git push origin HEAD:refs/heads/security/isolated-trust-boundary-audit-20261123
