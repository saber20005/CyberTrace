name: CyberTrace quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:structure
      - run: npm run lint
      - run: npm test
      - run: npm run build

  journeys-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install isolated pinned browser driver
        run: npm install --prefix /tmp/cybertrace-playwright --no-audit --no-fund --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: node /tmp/cybertrace-playwright/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check shared pathways in real mobile and desktop browsers
        env:
          CYBERTRACE_PLAYWRIGHT_MODULE: /tmp/cybertrace-playwright/node_modules/playwright/index.mjs
        run: |
          node scripts/test-unified-journeys-browser.mjs
          node scripts/test-experience-studio-browser.mjs
          node scripts/test-first-visit-tour-browser.mjs
